<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            flex: 1;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .note-editor {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .note-item {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .note-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .note-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
        }

        .note-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .note-category {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            margin-top: 5px;
            margin-right: 5px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: #333;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 NoteTaker</h1>
            <p>Organize your thoughts, capture your ideas</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <div id="authSection">
                    <div id="loginForm" style="margin-bottom: 15px;">
                        <input type="text" class="form-input" id="authUsername" placeholder="Username" style="margin-bottom: 8px; padding: 8px 12px; font-size: 14px;">
                        <input type="password" class="form-input" id="authPassword" placeholder="Password" style="margin-bottom: 8px; padding: 8px 12px; font-size: 14px;">
                        <div style="display: flex; gap: 5px;">
                            <button class="btn btn-save" id="loginBtn" style="flex: 1; padding: 8px; font-size: 14px;">Login</button>
                            <button class="btn" id="registerBtn" style="flex: 1; padding: 8px; font-size: 14px; background: #6c757d; color: white;">Register</button>
                        </div>
                    </div>
                    <div id="userInfo" style="display: none; margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                        <div style="font-weight: 600; color: #333;" id="usernameDisplay"></div>
                        <button class="btn" id="logoutBtn" style="padding: 6px 12px; font-size: 12px; background: #dc3545; color: white; margin-top: 5px;">Logout</button>
                    </div>
                </div>
                
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                
                <div class="form-group" style="margin-bottom: 15px;">
                    <select class="form-input" id="categoryFilter" style="padding: 8px 12px; font-size: 14px;">
                        <option value="">All Categories</option>
                    </select>
                </div>
                
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn" id="shareBtn" style="background: #17a2b8; color: white;">🔗 Share</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteCategory">Category</label>
                        <input type="text" class="form-input" id="noteCategory" placeholder="Enter category (e.g., Work, Personal, Ideas)" list="categoryList">
                        <datalist id="categoryList"></datalist>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Sharing Modal -->
    <div id="shareModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 15px; padding: 30px; width: 90%; max-width: 500px;">
            <h3 style="margin-bottom: 20px; color: #333;">Share Note</h3>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Share with users:</label>
                <input type="text" id="shareUsernames" placeholder="Enter usernames separated by commas" style="width: 100%; padding: 10px; border: 2px solid #e1e5e9; border-radius: 8px; margin-bottom: 10px;">
                <button id="shareWithUsersBtn" class="btn btn-save" style="margin-right: 10px;">Share</button>
            </div>
            
            <div style="margin-bottom: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Public sharing:</label>
                <button id="makePublicBtn" class="btn" style="background: #28a745; color: white; margin-right: 10px;">Make Public</button>
                <button id="makePrivateBtn" class="btn" style="background: #6c757d; color: white; margin-right: 10px;">Make Private</button>
                <div id="publicLinkArea" style="margin-top: 10px; display: none;">
                    <input type="text" id="publicLink" readonly style="width: 100%; padding: 8px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px;">
                </div>
            </div>
            
            <div style="text-align: right;">
                <button id="closeShareModal" class="btn" style="background: #6c757d; color: white;">Close</button>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.categories = [];
                this.currentNote = null;
                this.currentUser = null;
                this.isLoading = false;
                this.currentCategoryFilter = '';
                this.init();
            }

            // Helper method for authenticated fetch requests
            async authFetch(url, options = {}) {
                return fetch(url, {
                    credentials: 'include',
                    ...options
                });
            }

            async init() {
                this.bindEvents();
                await this.checkAuthStatus();
                await this.loadCategories();
                await this.loadNotes();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('shareBtn').addEventListener('click', () => this.showShareModal());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                document.getElementById('categoryFilter').addEventListener('change', (e) => this.filterByCategory(e.target.value));
                
                // Auth events
                document.getElementById('loginBtn').addEventListener('click', () => this.login());
                document.getElementById('registerBtn').addEventListener('click', () => this.register());
                document.getElementById('logoutBtn').addEventListener('click', () => this.logout());
                
                // Sharing events
                document.getElementById('closeShareModal').addEventListener('click', () => this.hideShareModal());
                document.getElementById('shareWithUsersBtn').addEventListener('click', () => this.shareWithUsers());
                document.getElementById('makePublicBtn').addEventListener('click', () => this.makePublic());
                document.getElementById('makePrivateBtn').addEventListener('click', () => this.makePrivate());
                
                // Auto-save on content change (debounced)
                let saveTimeout;
                const autoSave = () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);
                document.getElementById('noteCategory').addEventListener('input', autoSave);
            }

            async loadCategories() {
                try {
                    const response = await this.authFetch('/api/notes/categories');
                    if (!response.ok) throw new Error('Failed to load categories');
                    
                    this.categories = await response.json();
                    this.renderCategoryFilter();
                    this.renderCategoryDatalist();
                } catch (error) {
                    console.error('Error loading categories:', error);
                }
            }

            renderCategoryFilter() {
                const filter = document.getElementById('categoryFilter');
                filter.innerHTML = '<option value="">All Categories</option>';
                
                this.categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    if (category === this.currentCategoryFilter) {
                        option.selected = true;
                    }
                    filter.appendChild(option);
                });
            }

            renderCategoryDatalist() {
                const datalist = document.getElementById('categoryList');
                datalist.innerHTML = '';
                
                this.categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    datalist.appendChild(option);
                });
            }

            filterByCategory(category) {
                this.currentCategoryFilter = category;
                this.renderNotesList();
            }

            // Authentication methods
            async checkAuthStatus() {
                try {
                    const response = await this.authFetch('/api/me');
                    if (response.ok) {
                        this.currentUser = await response.json();
                        this.showUserInfo();
                    } else {
                        this.showLoginForm();
                    }
                } catch (error) {
                    this.showLoginForm();
                }
            }

            showUserInfo() {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('userInfo').style.display = 'block';
                document.getElementById('usernameDisplay').textContent = `Welcome, ${this.currentUser.username}!`;
            }

            showLoginForm() {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('userInfo').style.display = 'none';
                this.currentUser = null;
            }

            async login() {
                const username = document.getElementById('authUsername').value.trim();
                const password = document.getElementById('authPassword').value.trim();
                
                if (!username || !password) {
                    this.showMessage('Please enter username and password', 'error');
                    return;
                }

                try {
                    const response = await this.authFetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (response.ok) {
                        this.currentUser = await response.json();
                        this.showUserInfo();
                        this.showMessage('Logged in successfully!', 'success');
                        await this.loadNotes(); // Reload notes for the user
                        
                        // Clear form
                        document.getElementById('authUsername').value = '';
                        document.getElementById('authPassword').value = '';
                    } else {
                        const error = await response.json();
                        this.showMessage(error.error || 'Login failed', 'error');
                    }
                } catch (error) {
                    this.showMessage('Login failed: ' + error.message, 'error');
                }
            }

            async register() {
                const username = document.getElementById('authUsername').value.trim();
                const password = document.getElementById('authPassword').value.trim();
                
                if (!username || !password) {
                    this.showMessage('Please enter username and password', 'error');
                    return;
                }

                try {
                    const email = `${username}@example.com`; // Simple email generation
                    const response = await this.authFetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });

                    if (response.ok) {
                        this.currentUser = await response.json();
                        this.showUserInfo();
                        this.showMessage('Registered and logged in successfully!', 'success');
                        await this.loadNotes(); // Reload notes for the user
                        
                        // Clear form
                        document.getElementById('authUsername').value = '';
                        document.getElementById('authPassword').value = '';
                    } else {
                        const error = await response.json();
                        this.showMessage(error.error || 'Registration failed', 'error');
                    }
                } catch (error) {
                    this.showMessage('Registration failed: ' + error.message, 'error');
                }
            }

            async logout() {
                try {
                    await this.authFetch('/api/logout', { method: 'POST' });
                    this.currentUser = null;
                    this.showLoginForm();
                    this.showMessage('Logged out successfully!', 'success');
                    await this.loadNotes(); // Reload notes (will show all notes)
                } catch (error) {
                    this.showMessage('Logout failed: ' + error.message, 'error');
                }
            }

            // Sharing methods
            showShareModal() {
                if (!this.currentUser) {
                    this.showMessage('Please login to share notes', 'error');
                    return;
                }
                
                if (!this.currentNote || !this.currentNote.id) {
                    this.showMessage('Please save the note first', 'error');
                    return;
                }
                
                document.getElementById('shareModal').style.display = 'block';
            }

            hideShareModal() {
                document.getElementById('shareModal').style.display = 'none';
                document.getElementById('shareUsernames').value = '';
                document.getElementById('publicLinkArea').style.display = 'none';
            }

            async shareWithUsers() {
                const usernames = document.getElementById('shareUsernames').value
                    .split(',')
                    .map(u => u.trim())
                    .filter(u => u.length > 0);

                if (usernames.length === 0) {
                    this.showMessage('Please enter usernames to share with', 'error');
                    return;
                }

                try {
                    const response = await this.authFetch(`/api/notes/${this.currentNote.id}/share`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usernames })
                    });

                    if (response.ok) {
                        const result = await response.json();
                        this.showMessage(result.message, 'success');
                        document.getElementById('shareUsernames').value = '';
                    } else {
                        const error = await response.json();
                        this.showMessage(error.error || 'Sharing failed', 'error');
                    }
                } catch (error) {
                    this.showMessage('Sharing failed: ' + error.message, 'error');
                }
            }

            async makePublic() {
                try {
                    const response = await this.authFetch(`/api/notes/${this.currentNote.id}/public`, {
                        method: 'POST'
                    });

                    if (response.ok) {
                        const result = await response.json();
                        this.showMessage('Note is now publicly accessible', 'success');
                        
                        const publicUrl = `${window.location.origin}/api${result.public_url}`;
                        document.getElementById('publicLink').value = publicUrl;
                        document.getElementById('publicLinkArea').style.display = 'block';
                    } else {
                        const error = await response.json();
                        this.showMessage(error.error || 'Failed to make note public', 'error');
                    }
                } catch (error) {
                    this.showMessage('Failed to make note public: ' + error.message, 'error');
                }
            }

            async makePrivate() {
                try {
                    const response = await this.authFetch(`/api/notes/${this.currentNote.id}/unpublic`, {
                        method: 'POST'
                    });

                    if (response.ok) {
                        this.showMessage('Note is now private', 'success');
                        document.getElementById('publicLinkArea').style.display = 'none';
                    } else {
                        const error = await response.json();
                        this.showMessage('Failed to make note private', 'error');
                    }
                } catch (error) {
                    this.showMessage('Failed to make note private: ' + error.message, 'error');
                }
            }
            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await this.authFetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList() {
                const notesList = document.getElementById('notesList');
                
                // Filter notes by category if a filter is set
                let filteredNotes = this.notes;
                if (this.currentCategoryFilter) {
                    filteredNotes = this.notes.filter(note => note.category === this.currentCategoryFilter);
                }
                
                if (filteredNotes.length === 0) {
                    const emptyMessage = this.currentCategoryFilter 
                        ? `No notes found in "${this.currentCategoryFilter}" category.`
                        : 'No notes yet. Create your first note!';
                    notesList.innerHTML = `<div class="empty-state"><p>${emptyMessage}</p></div>`;
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-category">${this.escapeHtml(note.category || 'General')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('noteCategory').value = note.category || 'General';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
            }

            createNewNote() {
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    category: 'General',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('noteCategory').value = 'General';
                document.getElementById('editorTitle').textContent = 'New Note';
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.currentNote = null;
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();
                const category = document.getElementById('noteCategory').value.trim() || 'General';

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content,
                        category: category
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await this.authFetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await this.authFetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    // Reload categories if a new one was added
                    if (!this.categories.includes(category)) {
                        await this.loadCategories();
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                try {
                    const response = await this.authFetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }

            searchNotes(query) {
                let filteredNotes = this.notes;
                
                // Apply category filter first
                if (this.currentCategoryFilter) {
                    filteredNotes = filteredNotes.filter(note => note.category === this.currentCategoryFilter);
                }
                
                // Apply search filter
                if (query.trim() !== '') {
                    filteredNotes = filteredNotes.filter(note => 
                        (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                        (note.content && note.content.toLowerCase().includes(query.toLowerCase()))
                    );
                }

                const notesList = document.getElementById('notesList');
                if (filteredNotes.length === 0) {
                    const emptyMessage = query.trim() 
                        ? 'No notes found matching your search.'
                        : (this.currentCategoryFilter ? `No notes found in "${this.currentCategoryFilter}" category.` : 'No notes found.');
                    notesList.innerHTML = `<div class="empty-state"><p>${emptyMessage}</p></div>`;
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-category">${this.escapeHtml(note.category || 'General')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
